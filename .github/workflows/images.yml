name: Images

on:
  push:

env:
  REGION: australia-southeast1
  REPOSITORY: career-assist
  API_SERVICE: career-assist-api
  WEB_SERVICE: career-assist-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -f Dockerfile.api -t career-assist-api .

      - name: Build the frontend image
        run: docker build -f Dockerfile.web -t career-assist-web .

      - name: Check that the API starts
        run: |
          docker run -d --name api -p 8765:8765 -e PORT=8765 career-assist-api
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Point gcloud at the project
        run: gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"

      - name: Sign in to Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Publish and deploy the API
        id: api
        run: |
          set -euo pipefail
          image="$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$REPOSITORY/api:${{ github.sha }}"
          docker build -f Dockerfile.api -t "$image" .
          docker push "$image"
          secret_args=()
          if gcloud secrets describe OPENAI_API_KEY >/dev/null 2>&1; then
            secret_args+=(--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest)
          fi
          gcloud run deploy "$API_SERVICE" \
            --image "$image" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 900 \
            --max-instances 2 \
            "${secret_args[@]}"
          url="$(gcloud run services describe "$API_SERVICE" --region "$REGION" --format='value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Publish and deploy the frontend
        id: web
        run: |
          set -euo pipefail
          image="$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$REPOSITORY/web:${{ github.sha }}"
          docker build -f Dockerfile.web \
            --build-arg "NEXT_PUBLIC_API_URL=${{ steps.api.outputs.url }}" \
            -t "$image" .
          docker push "$image"
          gcloud run deploy "$WEB_SERVICE" \
            --image "$image" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 60 \
            --max-instances 2
          url="$(gcloud run services describe "$WEB_SERVICE" --region "$REGION" --format='value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Allow the frontend origin on the API
        run: |
          gcloud run services update "$API_SERVICE" \
            --region "$REGION" \
            --update-env-vars "CORS_ORIGINS=${{ steps.web.outputs.url }}"
